version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Electron carries Chromium: its security fixes are taken on their own, and quickly.
      electron:
        patterns: ['electron', 'electron-builder']
      codemirror:
        patterns: ['@codemirror/*', '@lezer/*']
      testing:
        patterns: ['vitest', '@playwright/test', '@testing-library/*', 'happy-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

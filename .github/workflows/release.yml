name: Release

# A release is made by pushing a tag `vX.Y.Z` (or `vX.Y.Z-beta.1`) on main, after the pull request made by `node scripts/release.mjs prepare X.Y.Z`
# has been merged (docs/RELEASING.md). The four release files are built on their own systems, checked, and published with their checksums.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build and publish again (vX.Y.Z); it must exist'
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          # Only a tag of the form vX.Y.Z or vX.Y.Z-pre goes on: the name is used in commands below.
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "not a release tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The version of the tag is the version of the code, and the changelog has its notes
        run: |
          test "$(node -p "require('./package.json').version")" = "${{ steps.tag.outputs.version }}"
          node scripts/release.mjs notes "${{ steps.tag.outputs.version }}" > /dev/null

  build:
    name: Build on ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            script: package:linux
          - os: windows-latest
            script: package:win
          - os: macos-latest
            script: package:mac
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Tools for .rpm and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run notices:check
      - run: npm run ${{ matrix.script }}
        env:
          # Signing, when the secrets are set (docs/RELEASING.md): Windows code signing, and macOS Developer ID with notarisation.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Packaging smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/package-smoke.mjs --no-sandbox
      - name: Packaging smoke test
        if: runner.os != 'Linux'
        run: node scripts/package-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: files
          pattern: release-*
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd files && sha256sum * > SHA256SUMS.txt && cd ..
          node scripts/release.mjs notes "${{ needs.check.outputs.version }}" > notes.md
          {
            echo
            echo '## Files'
            echo
            echo 'The files are not signed yet: Windows and macOS warn on the first launch (see the README). Check a download against these SHA-256 sums:'
            echo
            echo '```text'
            cat files/SHA256SUMS.txt
            echo '```'
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          if gh release view "${{ needs.check.outputs.tag }}" > /dev/null 2>&1; then
            gh release upload "${{ needs.check.outputs.tag }}" files/* --clobber
            gh release edit "${{ needs.check.outputs.tag }}" --notes-file notes.md $flags
          else
            gh release create "${{ needs.check.outputs.tag }}" files/* --title "Folder Browser ${{ needs.check.outputs.version }}" --notes-file notes.md $flags --verify-tag
          fi

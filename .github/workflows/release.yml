name: Release (macOS)

# The only thing that runs on GitHub, to spare the free quota: the macOS `.dmg`, which needs a Mac. Everything else (the checks, the `.exe`, `.deb` and `.rpm`, and the GitHub Release
# with its tag) is made on the maintainer's computer by `node scripts/release-local.mjs --publish` (docs/RELEASING.md). Nothing here starts by itself: run it by hand, from the
# Actions tab, for a release that exists. It builds the `.dmg` from that tag, runs the unit tests and the packaging smoke test on the Mac, and adds the file and its checksum to the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release to add the .dmg to (vX.Y.Z); it must exist, published from the maintainer''s computer'
        required: true
      dry_run:
        description: 'A rehearsal: `tag` is a branch (or a tag), it is built and checked on the Mac like a release, and nothing is added to any release (nor needs to exist)'
        type: boolean
        default: false
      e2e:
        description: 'Also run the end-to-end tests on the Mac (about 10 minutes of the quota; the unit tests always run)'
        type: boolean
        default: false

concurrency:
  group: release-mac
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mac:
    name: Build the .dmg on macOS
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag }}
      DRY: ${{ github.event.inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The tag is a release that exists
        shell: bash
        run: |
          # A rehearsal builds a branch or a tag, and needs no release: only a name made of safe characters goes on.
          if [ "$DRY" = "true" ]; then echo "$TAG" | grep -Eq '^[A-Za-z0-9._/-]+$' || { echo "not a branch or a tag name: $TAG"; exit 1; }; echo "A rehearsal of $TAG: nothing is added to a release."; exit 0; fi
          # Only a tag of the form vX.Y.Z or vX.Y.Z-pre goes on: the name is used in commands below.
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "not a release tag: $TAG"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || { echo "There is no release $TAG: publish it first with 'node scripts/release-local.mjs --publish'"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The version of the tag is the version of the code
        if: github.event.inputs.dry_run != 'true'
        run: test "$(node -p "require('./package.json').version")" = "${TAG#v}"
      - run: npm ci
      - run: npm test
      - name: End-to-end tests
        if: github.event.inputs.e2e == 'true'
        run: npm run build && npx playwright test
      - run: npm run package:mac
        env:
          # Signing, when the secrets are set (docs/RELEASING.md): the macOS Developer ID certificate, and notarisation.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Packaging smoke test
        run: node scripts/package-smoke.mjs
      - name: Add the .dmg and its checksum to the release
        if: github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          set -e
          dmg=$(ls release/*.dmg | head -n 1)
          name=$(basename "$dmg")
          mkdir sums && cd sums
          # The checksums of the release (made on the maintainer's computer) get the line of the .dmg, replacing an older one.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt || : > SHA256SUMS.txt
          grep -v " ${name}\$" SHA256SUMS.txt > kept.txt || true
          (cd ../release && shasum -a 256 "$name") >> kept.txt
          mv kept.txt SHA256SUMS.txt
          cd ..
          gh release upload "$TAG" "$dmg" sums/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          echo "### $name added to $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- $(du -m "$dmg" | cut -f1) MB (unsigned unless the signing secrets are set)" >> "$GITHUB_STEP_SUMMARY"
      - name: What the rehearsal made
        if: github.event.inputs.dry_run == 'true'
        shell: bash
        run: |
          echo "### Rehearsal of $TAG: built and checked, nothing added to a release" >> "$GITHUB_STEP_SUMMARY"
          ls -la release/*.dmg >> "$GITHUB_STEP_SUMMARY" || true
